<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Destino')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <h1 th:text="${destino.id == null} ? 'Nuevo destino' : 'Editar destino'"></h1>
    <div class="panel">
        <form th:action="${destino.id == null} ? @{/destinos} : @{'/destinos/' + ${destino.id}}" method="post" th:object="${destino}">
            <div class="form-grid">
                <div><label>Nombre</label><input type="text" th:field="*{nombre}" required></div>
                <div><label>Dirección</label><input type="text" th:field="*{direccion}" required></div>
                <div><label>Ciudad</label><input type="text" th:field="*{ciudad}" required></div>
                <div>
                    <label>Vehículo</label>
                    <select th:field="*{vehiculoId}">
                        <option value="">-- Sin vehículo --</option>
                        <option th:each="v : ${vehiculos}" th:value="${v.id}" th:text="${v.matricula + ' - ' + v.marca + ' ' + v.modelo}"></option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn secondary" th:href="@{/destinos}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
