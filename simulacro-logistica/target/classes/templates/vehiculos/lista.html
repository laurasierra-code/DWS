<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Vehículos')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div class="header-row">
        <h1>Vehículos</h1>
        <a class="btn" th:href="@{/vehiculos/nuevo}">Nuevo vehículo</a>
    </div>
    <table class="table">
        <thead><tr><th>Matrícula</th><th>Marca</th><th>Modelo</th><th>Capacidad (kg)</th><th>Nº destinos</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="v : ${vehiculos}">
            <td th:text="${v.matricula}"></td>
            <td th:text="${v.marca}"></td>
            <td th:text="${v.modelo}"></td>
            <td th:text="${v.capacidadKg}"></td>
            <!-- TODO EXAMEN (Tarea 1): Mostrar el número de destinos del DTO mediante Thymeleaf -->
            <td th:text="${v.numeroDestinos}"></td>
            <td class="actions">
                <a class="btn small secondary" th:href="@{'/vehiculos/' + ${v.id}}">Ver</a>
                <a class="btn small" th:href="@{'/vehiculos/' + ${v.id} + '/editar'}">Editar</a>
                <form class="inline" th:action="@{'/vehiculos/' + ${v.id} + '/eliminar'}" method="post" onsubmit="return confirm('¿Eliminar vehículo?');">
                    <button class="btn small danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(vehiculos)}"><td colspan="6" class="muted">No hay vehículos.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
