<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Destinos')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div class="header-row">
        <h1>Destinos</h1>
        <a class="btn" th:href="@{/destinos/nuevo}">Nuevo destino</a>
    </div>
    <table class="table">
        <thead><tr><th>Nombre</th><th>Dirección</th><th>Ciudad</th><th>Vehículo</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="d : ${destinos}">
            <td th:text="${d.nombre}"></td>
            <td th:text="${d.direccion}"></td>
            <td th:text="${d.ciudad}"></td>
            <td th:text="${d.vehiculoMatricula != null} ? ${d.vehiculoMatricula} : 'Sin vehículo'"></td>
            <td class="actions">
                <a class="btn small secondary" th:href="@{'/destinos/' + ${d.id}}">Ver</a>
                <a class="btn small" th:href="@{'/destinos/' + ${d.id} + '/editar'}">Editar</a>
                <form class="inline" th:action="@{'/destinos/' + ${d.id} + '/eliminar'}" method="post" onsubmit="return confirm('¿Eliminar destino?');">
                    <button class="btn small danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(destinos)}"><td colspan="5" class="muted">No hay destinos.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
