<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Conductor')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <h1 th:text="${conductor.id == null} ? 'Nuevo conductor' : 'Editar conductor'"></h1>
    <div class="panel">
        <form th:action="${conductor.id == null} ? @{/conductores} : @{'/conductores/' + ${conductor.id}}" method="post" th:object="${conductor}">
            <div class="form-grid">
                <div><label>DNI</label><input type="text" th:field="*{dni}" required></div>
                <div><label>Nombre</label><input type="text" th:field="*{nombre}" required></div>
                <div><label>Primer apellido</label><input type="text" th:field="*{apellido1}" required></div>
                <div><label>Segundo apellido</label><input type="text" th:field="*{apellido2}"></div>
                <div><label>Teléfono</label><input type="text" th:field="*{telefono}"></div>
                <div>
                    <label>Vehículo</label>
                    <select th:field="*{vehiculoId}">
                        <option value="">-- Sin vehículo --</option>
                        <option th:each="v : ${vehiculos}" th:value="${v.id}" th:text="${v.matricula + ' - ' + v.marca + ' ' + v.modelo}"></option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn secondary" th:href="@{/conductores}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
