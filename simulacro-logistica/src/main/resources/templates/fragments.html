<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="head(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title}">Logística</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </div>
    <nav th:fragment="nav" class="navbar">
        <div class="container nav-inner">
            <a class="brand" th:href="@{/}" th:text="#{app.nombre}">Logística</a>
            <ul class="nav-links">
                <li><a th:href="@{/vehiculos}" th:text="#{nav.vehiculos}" >Vehículos</a></li>
                <li><a th:href="@{/conductores}" th:text="#{nav.conductores}" >Conductores</a></li>
                <li><a th:href="@{/destinos}" th:text="#{nav.destinos}" >Destinos</a></li>
                <li><a th:href="@{/paradas}" th:text="#{nav.paradas}" >Paradas</a></li>
                <li><a th:href="@{''(lang='es')}">ES</a></li>
                <li><a th:href="@{''(lang='en')}">EN</a></li>

            </ul>
        </div>
    </nav>
</body>

</html>
